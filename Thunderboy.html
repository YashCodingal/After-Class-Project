<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                background-color: rgb(11, 111, 111);
                color: azure;
                font-family: cursive;
            }
            .Hero-name{
                font-size: 60px;
                font-weight: bold;
                color: lawngreen;
                text-shadow: 3px,3px rgb(218, 73, 21);
            }
            .tagline{
                font-style: italic;
                color: rgb(79, 247, 152);
                text-transform: capitalize;
            }
            .Hero-name{
                font-size: 60px;
                font-weight: bold;
                color: lawngreen;
                text-shadow: 3px,3px rgb(219, 89, 41);
            }
            .label{
                text-transform: uppercase;
                text-decoration: underline;
color: rgb(8, 166, 166);
            }
            .power{
                font-weight: bold;
                color: rgb(206, 244, 244);
            }
            .Weakness{
                text-decoration: line-through;
                color: bisque;
            }
            .badge{
                font-size: 28px;
                font-weight: bold;
                color: rgb(213, 118, 3);
                transform: rotate(15deg);
            }
        </style>
    </head>
    <body>
        <h1 class="Hero-name">Thunder kid</h1>
        <p class="tagline">The most powerful hero in the school.</p>

        <h2 class="label">super powers</h2>
        <p class="power">Can run Faster than a cheetah</p>
        <p class="power">Can lift a school bus</p>

        <h2 class="label">Weakness</h2>
        <p class="Weakness">Math homework</p>
        <p class="Weakness">Broccoli</p>

        <p class="badge">Top hero</p>
        <p class="made-by">Created by Yash</p>
    </body>
</html>
