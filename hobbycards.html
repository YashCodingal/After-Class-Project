<!DOCTYPE html>
<html>
    <head>
        <title>My Hobby Cards</title>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- STEP 1 - Bootstrap CSS link -->

<link rel="stylesheet"

href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body {
        background-color: bisque;
        font-family: Arial, sans-serif;
        padding: 30px 15px;
    }

    h1{
        text-align: center;
        color: rgb(142, 78, 78);
    }
    .hobby-card {
        text-align: center;
        border: 2px solid rgb(109, 12, 12);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        background-color: rgb(255, 228, 196);
    }

    .hobby-card h3 {
        color: orangered;
    }
</style>

    </head>

    <body>
        <h1>My Hobby Cards</h1>
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Soccer</h3>
                        <p>I play soccer every single day outside.</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Drawing</h3>
                        <p>I like to draw pictures in my free time.</p>
                    </div>
                </div>

                <div class="col-12 col-md-12 col-lg-4">
                    <div class="hobby-card">
                        <h3>Reading</h3>
                        <p>I enjoy reading books about adventure.</p>
                    </div>
                </div>

                
            </div>
        </div>

        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>
    </body>
</html>
