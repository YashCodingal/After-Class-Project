<html>
    <head>
        <meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>

    body{
        background-color: rgb(137, 220, 176);
        font-family: Arial, sans-serif;
    }
</style>
    </head>

    <body>

        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h1>My Science Lab</h1>
                <p class="lead">Welcome to my science lab! There are experiments about various scientific topics.</p>
                <button class="btn btn-primary">Chemistry</button>
                <button class="btn btn-danger">Biology</button>
                <button class="btn btn-warning">Physics</button>
                <button class="btn btn-success">Astronomy</button>
            </div>
        </div>

        <div class="container">
            <h2 class="section-title">Experiments Completed<span class="badge badge-danger">4</span></h2>
            <p>Chemistry <span class="badge badge-primary">7 experiments</span></p>
            <p>Biology <span class="badge badge-danger">5 experiments</span></p>
            <p>Physics <span class="badge badge-success">3 experiments</span></p>
            <p>Astronomy <span class="badge badge-info">4 experiments</span></p>


            <h2 class="section-title">Research Progress</h2>
            <p>Chemistry</p>
            <div class="progress mb-3">
                <div class="progress-bar bg-Primary" style="width:85%">85%</div>
            </div>

            <p>Biology</p>
            <div class="progress mb-3">
                <div class="progress-bar bg-success" style="width:70%">70%</div>
            </div>

            <p>Physics</p>
            <div class="progress mb-3">
                <div class="progress-bar bg-warning" style="width:85%">85%</div>
            </div>

            <p>Astronomy</p>
            <div class="progress mb-3">
                <div class="progress-bar bg-info" style="width:60%">60%</div>
            </div>
        </div>

        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </body>
</html>
