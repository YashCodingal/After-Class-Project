<html>
    <body>
        <script>
            var i;
            for (i=0; i < 10; i++){
                document.write(i)
                document.write("<br>")
            }

            var fruits = ["Watermelon", "Avacado", "Pineapple", "Pomegranate", "Plum"]
            for (i=0; i<fruits.length; i++){
                document.write(fruits[i]+"<br>")
            }
        </script>
    </body>
</html>
