<html>
    <body>
    <button type="button" onclick="myFunction()">Click Me</button>
    <p id="demo"></p>
    <p id="demo2"></p>

    <script>

        var a = 37;
        function myFunction(){
            var b = 89;
            document.getElementById("demo").innerHTML = a * b
        }
        document.getElementById("demo2").innerHTML = b
    </script>
</body>

</html>
